# fly.toml - manefo backend on Fly.io
# Deploy: fly deploy --config backend/fly.toml

app = "manefo-backend"
primary_region = "nrt"  # 東京リージョン

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RUST_LOG = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# ヘルスチェック
[[services.tcp_checks]]
  interval = "10s"
  timeout = "5s"

[[services.http_checks]]
  interval = "10s"
  timeout = "5s"
  grace_period = "30s"
  path = "/health"
